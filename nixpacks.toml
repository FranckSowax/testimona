# Nixpacks build override.
# Reason: Nixpacks runs an `install` phase before our build command. By default
# it sets NODE_ENV=production, so pnpm skips devDependencies. Tailwind v4
# requires `@tailwindcss/postcss`, which lives in devDependencies, so the
# subsequent `next build` cannot resolve the PostCSS plugin and fails.
#
# Forcing NODE_ENV=development on the install phase keeps devDependencies.
# Nixpacks resets NODE_ENV to production for the build/start phases, so
# Next.js still produces a production build.

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "NODE_ENV=development pnpm install --frozen-lockfile",
]
