version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: testimona
      POSTGRES_PASSWORD: testimona_dev_password
      POSTGRES_DB: testimona
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testimona"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://testimona:testimona_dev_password@db:5432/testimona
      REDISCLOUD_URL: redis://redis:6379
      WHITELIST_URL: http://localhost:8080|http://localhost:4200
      TOKEN_KEY: change_me_in_production
      TOKEN_SUFFIX: _dev
      TOKEN_EXPIRED_SECONDS: 3600
      TOKEN_EXPIRED_SECONDS_REFRESH: 86400
      SECURE_COOKIE: "false"
      PRIVATE_PWD_KEY: change_me_private_key
      SECRET_PWD_KEY: change_me_secret_key
      SECRET_ANSWER_KEY: change_me_answer_key
      CONFIG_EXPIRED: 86400
      MEMORIAL_EXPIRED: 3600
      USER_EXPIRED: 3600
      ENVIRONMENT: development
      WEBSITE_URL: http://localhost:8080
      CONTACT_EMAIL: contact@testimona.com
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    depends_on:
      - api

volumes:
  postgres_data:
