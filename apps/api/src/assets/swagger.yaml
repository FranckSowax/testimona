securityDefinitions:
  cookie_register:
    type: "apiKey"
    name: "register_token"
    in: "header"
    required: true
  cookie_access:
    type: "apiKey"
    name: "access_token"
    in: "header"
    required: true
  cookie_refresh:
    type: "apiKey"
    name: "refresh_token"
    in: "header"
    required: true