swagger: "2.0"
info:
  description: "Testimona API"
  version: "1.0.0"
  title: "Testimona API"
host: "api-dev-testimona.herokuapp.com"
basePath: "/"
tags:
  - name: "Authentication"
    description: "API for authentication"
  - name: "Biography"
    description: "API for biography"
  - name: "Chapter"
    description: "API for chapter"
  - name: "Configuration"
    description: "API to get some configuration"
  - name: "Funeral"
    description: "API for funeral"
  - name: "Funeral Event"
    description: "API for funeral event"
  - name: "Memorial (Admin)"
    description: "API for admin memorial"
  - name: "Memorial (Public)"
    description: "API for public memorial"
  - name: "Photo"
    description: "API for public memorial"
  - name: "Register"
    description: "API for register"
  - name: "Testimonial"
    description: "API for testimonial"
schemes:
  - "https"
consumes:
  - application/json
produces:
  - application/json
paths:
  /admin/memorials/:page/:pageSize:
    get:
      tags:
        - "Memorial (Admin)"
      summary: "Url to get my memorials"
      description: ""
      security:
        - cookie_access: []
        - cookie_refresh: []
      parameters:
        - in: "path"
          required: true
          description: "Page"
        - in: "path"
          required: true
          description: "pageSize"
      responses:
        200:
          description: "Response of the process"
          schema:
            type: "object"
            properties:
              result:
                required: true
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  error:
                    description: "NoError if success true otherwise the value of the error"
                    type: "string"
                    example: 
                    - NoError
                    - InvalidParameter
                    - DataNotFound
              data:
                type: "object"
                description: "Return an array of memorial object if the current user has memorials"
                properties:
                  id:
                    type: "number"
                  url:
                    type: "string"
                  firstname:
                    type: "string"
                  lastname:
                    type: "string"
                  yearOfDeath:
                    type: "number"
                  monthOfDeath:
                    type: "number"
                  dayOfDeath:
                    type: "number"
                  countryOfDeath:
                    type: "string"
                  createdDate:
                    type: "string"
                  modifiedDate:
                    type: "string"
                  disabled:
                    type: "boolean"
        401:
          description: "Authorization information is missing or invalid"
        500:
          description: "Error during the process"
  /admin/memorials/:memorialId/admins:
    get:
      tags:
        - "Memorial (Admin)"
      summary: "Get list of admin users for a memorial"
      description: ""
      security:
        - cookie_access: []
        - cookie_refresh: []
      parameters:
        - in: "path"
          required: true
          description: "Memorial Url"
      responses:
        200:
          description: "Response of the process"
          schema:
            type: "object"
            properties:
              result:
                required: true
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  error:
                    description: "NoError if success true otherwise the value of the error"
                    type: "string"
                    example: 
                    - NoError
                    - MissingParameter
                    - MemorialNotExist
              data:
                type: "object"
                description: "Return list of admin user otherwise null"
                properties:
                  identity:
                    type: "string"
                  relationship:
                    type: "string"
                  isAdmin:
                    type: "boolean"
        401:
          description: "Authorization information is invalid"
        500:
          description: "Error during the process"
  /auth:
    post:
      tags:
        - "Authentication"
      summary: "Authenticate an user"
      description: ""
      parameters:
        - in: "body"
          required: true
          description: "Information to authenticate an user by email/pwd"
          schema:
            type: "object"
            required:
              - email
              - password
              - loginType
            properties:
              email:
                maxLength: 100
                type: "string"
              password:
                minLength: 8
                type: "string"
              loginType:
                type: "string"
                example: "Site"
      responses:
        200:
          description: "Response of the process"
          headers:
            set-cookies:
              description: "Create access token and refresh token"
              schema:
                type: "string"
                example:
                  - "access_token=access_token;path=/;HttpOnly;Secure"
                  - "refresh_token=refresh_token;path=/;HttpOnly;Secure"
          schema:
            type: "object"
            properties:
              result:
                required: true
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  error:
                    description: "NoError if success true otherwise the value of the error"
                    type: "string"
                    example: 
                    - NoError
                    - InvalidBodyData
                    - DataNotFound
                    - LoginFailed
                    - CreateTokenFailed
              data:
                type: "object"
                description: "Return user informations if register is ok otherwise null"
                properties:
                  firstname:
                    type: "string"
                  lastname:
                    type: "string"
                  nickname:
                    type: "string"
                  displayName:
                    description: "User display name on the site"
                    type: "string"
                    example:
                      - FirstnameLastname
                      - Nickname
                      - NicknameFirstnameLastname
                  role:
                    description: "User role"
                    type: "string"
                    example:
                      - User
                  language:
                    description: "User language"
                    type: "string"
                    example:
                      - en
                      - fr
        500:
          description: "Error during the process"
  /auth/social:
    post:
      tags:
        - "Authentication"
      summary: "Authenticate an user with Social Media"
      description: ""
      parameters:
        - in: "body"
          required: true
          description: "Information to authenticate an user on the site"
          schema:
            type: "object"
            required:
              - access_token
              - id_token
              - id
              - loginType
            properties:
              access_token:
                type: "string"
              id_token:
                type: "string"
              id:
                type: "string"
              loginType:
                type: "string"
                example: "Google"
      responses:
        200:
          description: "Response of the process"
          headers:
            set-cookies:
