                    - RegisterSocialMediaFailed
                    - CreateTokenFailed
              data:
                type: "object"
                description: "Return user informations if register is ok otherwise null"
                properties:
                  firstname:
                    type: "string"
                  lastname:
                    type: "string"
                  nickname:
                    type: "string"
                  displayName:
                    description: "User display name on the site"
                    type: "string"
                    example:
                      - FirstnameLastname
                      - Nickname
                      - NicknameFirstnameLastname
                  role:
                    description: "User role"
                    type: "string"
                    example:
                      - Relative
                      - User
                  language:
                    description: "User language"
                    type: "string"
                    example:
                      - en
                      - fr
        500:
          description: "Error during the process"
