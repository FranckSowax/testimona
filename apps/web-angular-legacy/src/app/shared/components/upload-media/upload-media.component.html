<section>
    <div class="div-add-button">
        <button class="add-media" (click)="uploadInput.click()" [disabled]="disabled">{{ 'shared.photo.btn_text' | transloco }}</button>
        <div class="upload-photo-container">
            <ng-container *ngFor="let file of currentFiles; index as i">
                <div class="filename"><img src="{{ file.photoUrl }}"><span class="material-icons" (click)="deleteFile(file.filename)">clear</span></div>
            </ng-container>
        </div>
        <input #uploadInput accept="{{ acceptedFiles }}" (change)="addFiles()" type="file" multiple>
    </div>
</section>
