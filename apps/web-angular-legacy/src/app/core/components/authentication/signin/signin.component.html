<section>
  <div class="container-header">
    <div>
      <img class="close-modal" (click)="closeModal()" src="{{assetUrl}}/close-modal.svg" alt="close Modal">
    </div>
  </div>
  <div class="container-signin">
      <img class="title_one" src="{{ titleLogo }}" alt="">
      <div></div>
      <!-- <div class="btn-social-medias">
          <asl-google-signin-button type="standard" size="medium" width="380" text="signin_with"></asl-google-signin-button>
      </div> -->
      <!-- <h2 class="subtitle-email">{{ 'auth.signin.title_email' | transloco }}</h2> -->

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
        <div *ngIf="errorMessage != ''" class="error-message">
          <span>
            {{ errorMessage }}
          </span>
        </div>
        <div class="form-input">
          <input
              type="email"
              formControlName="email"
              placeholder="{{ 'auth.signin.email' | transloco }}"
            />
        </div>
        <div class="form-input password">
          <input
            [type]="hide ? 'password' : 'text'"
            formControlName="password"
            placeholder="{{ 'auth.signin.password' | transloco }}"
          />
          <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </div>
        <p class="forget_password">{{ 'auth.signin.forget_password' | transloco | uppercase }}</p>
        <div class="buttons">
          <button *ngIf="!submitInProgress" type="submit" class="btn-outlined pink" [disabled]="!signInForm.valid">{{ 'auth.signin.send' | transloco }}</button>
          <button *ngIf="submitInProgress" type="button" class="btn-outlined pink" disabled><mat-spinner [diameter]="25"></mat-spinner></button>
          <button *ngIf="!submitInProgress" type="button" class="btn-outlined grey" (click)="closeModal()">{{ 'auth.signup.cancel' | transloco }}</button>
          <button *ngIf="submitInProgress" type="button" class="btn-outlined grey" disabled>{{ 'auth.signup.cancel' | transloco }}</button>
        </div>
      </form>
      <div class= "infos-signin">
        <div class="policy-sigin">
          <p>{{ 'auth.signin.policy' | transloco }}</p>
        </div>
        <hr>
        <div class="signup-signin">
          <p>{{ 'auth.signin.text_signup' | transloco }}</p>
          <p class="link_signup" (click)="redirectSignUp()">{{ 'auth.signin.link_signup' | transloco }}</p>
        </div>
      </div>
  </div>
</section>
