<section class="main-home">
  <div class="first-section">
    <div class="div-logo-home">
      <img src="{{ assetUrl }}home/{{ imageName }}" alt="" />
    </div>

    <div class="div-home-btns">
      <button class="btn-container pink" (click)="createTestimona()">
        {{ 'site.home.button.testimona' | transloco }}
      </button>
      <button class="btn-outlined dark-blue" (click)="createMemorial()">
        {{ 'site.home.button.memorial' | transloco }}
      </button>
    </div>
  </div>
</section>

<shared-modal-view [modalData]="createMemorialModalViewModel">
  <app-create-memorial *ngIf="displayCreateMemorial"></app-create-memorial>
</shared-modal-view>

<shared-modal-view [modalData]="createTestimonaModalViewModel">
  <app-home-testimona *ngIf="displayCreateTestimona"></app-home-testimona>
</shared-modal-view>

<shared-modal-view [modalData]="activateUserModalViewModel">
  <app-activate-user *ngIf="displayActivateUser" [userId]="userId"></app-activate-user>
</shared-modal-view>
