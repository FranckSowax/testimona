<section *ngIf="loadingDone">
  <div class="add-donation">
    <div class="container-header">
      <div class="close-modal">
        <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
      </div>
    </div>
    <h1>{{ 'donation.add_donation.title' | transloco }}</h1>
    <h2 class="title">{{memorialItem.firstname}} {{memorialItem.lastname}}</h2>
    <label class="container-checkbox">
      <p class="label">{{ 'donation.add_donation.hide_donateur' | transloco }}</p>
      <input type="checkbox" name="anonymous-donation" (click)="updateAnonymousStatus()">
    </label>
    <div class="buttons">
      <button class="btn-outlined pink" (click)="makeDonation()">{{ 'donation.add_donation.save' | transloco }}</button>
      <button class="btn-outlined grey" (click)="closeModal()">{{ 'donation.add_donation.cancel' | transloco }}</button>
    </div>
  </div>
</section>
