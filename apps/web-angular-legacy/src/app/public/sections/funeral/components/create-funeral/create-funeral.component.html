<section>
  <div *ngIf="!loadingDone" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="loadingDone" class="body">
    <div class="create-funeral">
      <div class="container-header">
        <div class="close-modal">
          <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
        </div>
      </div>
      <div class="body">
        <h1>{{ 'funeral.create_edit_funeral.create_title' | transloco }}</h1>
        <p class="subtitle">{{ 'funeral.create_edit_funeral.subtitle_create' | transloco }}</p>
        <form [formGroup]="createFuneralForm" (ngSubmit)="onSubmitForm()">
          <textarea rows="6" type="text" id="content" formControlName="content"
            placeholder="{{ 'funeral.create_edit_funeral.funeral_information' | transloco }}" [ngClass]="{
            'is-invalid':
            !formControls.content.valid && formControls.content.touched
            }"></textarea>
          <div class="buttons">
            <button type="submit" class="btn-outlined dark-blue" [disabled]="createFuneralForm.invalid">{{ 'funeral.create_edit_funeral.submit' | transloco }}</button>
            <button type="button" class="btn-outlined grey" (click)="closeModal()">{{ 'funeral.create_edit_funeral.cancel' | transloco }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
