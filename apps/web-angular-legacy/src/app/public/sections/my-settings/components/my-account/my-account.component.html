<section>
  <div *ngIf="!loadingDone" class="loading">
      <mat-spinner></mat-spinner>
    </div>

  <div *ngIf="loadingDone" class="body">
    <h3><a href="">{{ 'mysettings.settings.title' | transloco }}</a><span> > {{ 'mysettings.settings.my_account' | transloco }}</span></h3>
    <div class="settings">
      <mat-accordion>
        <mat-expansion-panel [expanded]="true">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <h3>{{ 'mysettings.settings.my_account' | transloco }}<span *ngIf="resultUserInfoUpdate"> - {{ resultUserInfoUpdate }}</span></h3>
            </mat-panel-title>
          </mat-expansion-panel-header>
          <form [formGroup]="myAccountForm" (ngSubmit)="onSubmit()">
            <div *ngIf="errorMessage != ''" class="error-message">
              <span>
                {{ errorMessage }}
              </span>
            </div>
            <div class="form-input">
              <input
                  type="email"
                  formControlName="email"
                  readonly
                  placeholder="{{ 'mysettings.myaccount.email' | transloco }}"
                />
            </div>
            <div class="form-input">
              <input
                  type="firstname"
                  formControlName="firstname"
                  placeholder="{{ 'mysettings.myaccount.firstname' | transloco }}"
                />
            </div>
            <div class="form-input">
              <input
                  type="lastname"
                  formControlName="lastname"
                  placeholder="{{ 'mysettings.myaccount.lastname' | transloco }}"
                />
            </div>
            <div class="form-input">
              <input
                  type="nickname"
                  formControlName="nickname"
                  placeholder="{{ 'mysettings.myaccount.nickname' | transloco }}"
                />
            </div>

            <div class="buttons">
              <button type="submit" class="btn-outlined pink">{{ 'mysettings.myaccount.save' | transloco }}</button>
            </div>
          </form>
        </mat-expansion-panel>
        <mat-expansion-panel *ngIf="userInfo.loginType == authenticationTypeEnum.Site">
          <mat-expansion-panel-header>
            <mat-panel-title>
              <h3>{{ 'mysettings.settings.security_question' | transloco }}<span *ngIf="resultSecuQuestionInfoUpdate"> - {{ resultSecuQuestionInfoUpdate }}</span></h3>
            </mat-panel-title>
          </mat-expansion-panel-header>
          <form [formGroup]="mySecuQuestionsForm" (ngSubmit)="onSecurityQuestionSubmit()">
            <div class="security-questions-div">
              <select matNativeControl formControlName="firstSecuQuestion">
                <option value="{{ userInfo.questionsData[0].id }}">{{ userInfo.questionsData[0].content }}</option>
                <ng-template ngFor let-question [ngForOf]="securityQuestions">
                  <option *ngIf="question.id != userInfo.questionsData[0].id" [ngValue]="question.id">{{ question.content }}</option>
                </ng-template>
                </select>
            </div>
            <div class="secret-answer-div">
              <input type="text" id="firstAnswer" formControlName='firstAnswer' placeholder="{{ 'mysettings.settings.answer' | transloco }}">
            </div>
            <div class="security-questions-div">
              <select matNativeControl formControlName="secondSecuQuestion">
                <option value="{{ userInfo.questionsData[1].id }}">{{ userInfo.questionsData[1].content }}</option>
                <ng-template ngFor let-question [ngForOf]="securityQuestions">
                  <option *ngIf="question.id != userInfo.questionsData[1].id" [ngValue]="question.id">{{ question.content }}</option>
                </ng-template>
              </select>
            </div>
            <div class="secret-answer-div">
              <input type="text" id="secondAnswer" formControlName='secondAnswer' placeholder="{{ 'mysettings.settings.answer' | transloco }}">
            </div>
            <div class="buttons">
              <button type="submit" class="btn-outlined pink">{{ 'mysettings.myaccount.save' | transloco }}</button>
            </div>
          </form>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
  </div>
</section>
