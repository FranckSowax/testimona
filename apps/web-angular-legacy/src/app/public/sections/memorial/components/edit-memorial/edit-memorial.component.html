<section>
    <div *ngIf="!loadingDone" class="loading">
        <mat-spinner></mat-spinner>
      </div>
    
    <div *ngIf="loadingDone" class="body">
        <div class="edit-memorial">
            <div class="container-header">
                <div class="close-modal">
                    <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
                </div>
            </div>
            <div *ngIf="errorEditMemorial != ''" class="error-message">
                <span>{{ errorEditMemorial }}</span>
            </div>
            <div *ngIf="editMemorialItem" class="body">
                <h1>{{'memorial.edit_memorial.title' | transloco}}</h1>
                <form [formGroup]="editMemorialForm" (ngSubmit)="onSubmitForm()">
                    <input type="text" id="firstname" class="firstname" formControlName='firstname' placeholder="{{'memorial.edit_memorial.firstname' | transloco}}" [ngClass]="{
                        'is-invalid':
                        !formControls.firstname.valid && formControls.firstname.touched
                    }" />
                    <input type="text" id="lastname" class="lastname" formControlName='lastname' placeholder="{{ 'memorial.edit_memorial.lastname' | transloco }}"[ngClass]="{
                        'is-invalid':
                        !formControls.lastname.valid && formControls.lastname.touched
                    }" />
                    <div class="birth-date-form">
                        <p class="labelDate">{{ 'memorial.edit_memorial.date_of_birth' | transloco }}</p>
                        <select matNativeControl formControlName="yearOfBirth" id="yearOfBirth" class="yearOfBirth">
                            <option value="" disabled>{{ 'memorial.edit_memorial.year' | transloco }}</option>
                            <option *ngFor="let item of yearList" value="{{ item.key }}">{{ item.value }}</option>
                        </select>
                        <select matNativeControl formControlName="monthOfBirth" id="monthOfBirth" class="monthOfBirth">
                            <option value="" disabled>{{ 'memorial.edit_memorial.month' | transloco }}</option>
                            <option *ngFor="let item of monthList" value="{{ item.key }}">{{ item.value }}</option>
                        </select>
                        <select matNativeControl formControlName="dayOfBirth" id="dayOfBirth" class="dayOfBirth">
                            <option value="" disabled>{{ 'memorial.edit_memorial.day' | transloco }}</option>
                            <option *ngFor="let item of dayList" value="{{ item.key }}">{{ item.value }}</option>
                        </select>
                    </div>
                    <select matNativeControl #countryOfBirthSelect formControlName="countryOfBirth" class="countryOfBirth">
                        <option value="" disabled>{{ 'memorial.edit_memorial.country' | transloco }}</option>
                        <option *ngFor="let country of countries" id="{{country.id}}" value="{{country.id}}">{{country.code}}</option>
                    </select>
                    
                    <input type="text" id="cityOfBirth" formControlName='cityOfBirth' placeholder="{{ 'memorial.edit_memorial.city' | transloco }}"[ngClass]="{
                        'is-invalid':
                        !formControls.cityOfBirth.valid && formControls.cityOfBirth.touched
                    }"
                    />
                    <div class="death-date-form">
                        <p class="labelDate">{{ 'memorial.edit_memorial.date_of_death' | transloco }}</p>
                        <select matNativeControl formControlName="yearOfDeath" id="yearOfDeath" class="yearOfDeath">
                            <option value="" disabled>{{ 'memorial.edit_memorial.year' | transloco }}</option>
                            <option *ngFor="let item of yearList" value="{{ item.key }}">{{ item.value }}</option>
                        </select>
                        <select matNativeControl formControlName="monthOfDeath" id="monthOfDeath" class="monthOfDeath">
                            <option value="" disabled>{{ 'memorial.edit_memorial.month' | transloco }}</option>
                            <option *ngFor="let item of monthList" value="{{ item.key }}">{{ item.value }}</option>
                        </select>
                        <select matNativeControl formControlName="dayOfDeath" id="dayOfDeath" class="dayOfDeath">
                            <option value="" disabled>{{ 'memorial.edit_memorial.day' | transloco }}</option>
                            <option *ngFor="let item of dayList" value="{{ item.key }}">{{ item.value }}</option>
                        </select>
                    </div>
                    <select matNativeControl #countryOfDeathSelect formControlName="countryOfDeath" class="countryOfDeath">
                        <option value="{{countryOfDeathCode}}" selected>{{ countryOfDeathMemorial }}</option>
                        <option *ngFor="let country of countries" id="{{country.id}}" value="{{country.id}}">{{country.code}}</option>
                    </select>
                    
                    <input type="text" id="cityOfDeath" formControlName='cityOfDeath' placeholder="{{ 'memorial.edit_memorial.death_city' | transloco }}"[ngClass]="{
                        'is-invalid':
                        !formControls.cityOfDeath.valid && formControls.cityOfDeath.touched
                    }"
                    />
                    <label class="container-checkbox" [class.display]="displayIsAdminCheckbox">
                        <p>{{ 'memorial.edit_memorial.admin' | transloco }}</p>
                        <input type="checkbox" formControlName="isAdmin">
                    </label>
                    <textarea rows="6" type="text" id="shortBiography" formControlName="shortBiography" placeholder="{{ 'memorial.edit_memorial.biography' | transloco }}"[ngClass]="{
                        'is-invalid':
                        !formControls.shortBiography.valid && formControls.shortBiography.touched
                    }"
                    ></textarea>
                    <div class="buttons">
                        <button type="submit" class="btn-outlined dark-blue">{{ 'memorial.edit_memorial.send' | transloco }}</button>
                        <button type="button" class="btn-outlined grey" (click)="closeModal()">{{ 'memorial.edit_memorial.cancel' | transloco }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
