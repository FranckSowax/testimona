<section>
    <div class="create-memorial">
        <div class="container-header">
            <div class="close-modal">
                <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
            </div>
        </div>
        <h1>{{'site.memorial.title' | transloco}}</h1>
        <div *ngIf="errorCreateMemorial != ''" class="error-message">
            <span>{{ errorCreateMemorial }}</span>
        </div>
        <div>
            <form [formGroup]="createMemorialForm">
                <input type="text" id="firstname" class="firstname" formControlName='firstname' placeholder="{{'site.memorial.firstname' | transloco}}"[ngClass]="{
                    'is-invalid':
                    !formControls.firstname.valid && formControls.firstname.touched
                }"
                />
                <input type="text" id="lastname" class="lastname" formControlName='lastname' placeholder="{{ 'site.memorial.lastname' | transloco }}"[ngClass]="{
                    'is-invalid':
                    !formControls.lastname.valid && formControls.lastname.touched
                }"
                />
                <div class="death-date-form">
                    <p class="labelDate">{{ 'site.memorial.date_of_death' | transloco }}</p>
                    <select matNativeControl formControlName="yearOfDeath" id="yearOfDeath" class="yearOfDeath">
                        <option value="" disabled>{{ 'site.memorial.year' | transloco }}</option>
                        <option *ngFor="let item of yearList" value="{{ item.key }}">{{ item.value }}</option>
                    </select>
                    <select matNativeControl formControlName="monthOfDeath" id="monthOfDeath" class="monthOfDeath">
                        <option value="" disabled>{{ 'site.memorial.month' | transloco }}</option>
                        <option *ngFor="let item of monthList" value="{{ item.key }}">{{ item.value }}</option>
                    </select>
                    <select matNativeControl formControlName="dayOfDeath" id="dayOfDeath" class="dayOfDeath">
                        <option value="" disabled>{{ 'site.memorial.day' | transloco }}</option>
                        <option *ngFor="let item of dayList" value="{{ item.key }}">{{ item.value }}</option>
                    </select>
                </div>
                <select matNativeControl #countryOfDeathSelect formControlName="countryOfDeath" class="countryOfDeath">
                    <option value="" disabled>{{ 'site.memorial.country' | transloco }}</option>
                    <option *ngFor="let country of countries" id="{{country.id}}" value="{{country.id}}">{{country.code}}</option>
                </select>

                <input type="text" id="cityOfDeath" formControlName='cityOfDeath' placeholder="{{ 'site.memorial.city' | transloco }}"[ngClass]="{
                    'is-invalid':
                    !formControls.cityOfDeath.valid && formControls.cityOfDeath.touched
                }"
                />
                <div class="input-question">
                    <select matNativeControl formControlName="relatives" id="relatives" >
                        <option value="" disabled>{{ 'site.memorial.relationship' | transloco }}</option>
                        <option *ngFor="let relative of relatives; let i = index" value="{{i}}">{{relative.value}}</option>
                    </select>
                    <span mat-raised-button
                            class="tooltip"
                            matTooltip="Info about the action"
                            aria-label="Button that displays a tooltip when focused or hovered over">
                        <img src="{{assetUrl}}question-mark.svg" alt="">
                    </span>
                </div>
                <textarea rows="6" type="text" id="shortBiography" formControlName="shortBiography" placeholder="{{ 'site.memorial.biography' | transloco }}"[ngClass]="{
                    'is-invalid':
                    !formControls.shortBiography.valid && formControls.shortBiography.touched
                }"
                ></textarea>
                <div class="buttons">
                    <button *ngIf="!createInProgress" type="button" (click)="onSubmitForm()" class="btn-outlined dark-blue" [disabled]="createMemorialForm.invalid">{{ 'site.memorial.send' | transloco }}</button>
                    <button *ngIf="createInProgress" type="button" class="btn-outlined pink" disabled><mat-spinner [diameter]="25"></mat-spinner></button>

                    <button type="button" class="btn-outlined grey" (click)="closeModal()">{{ 'site.memorial.cancel' | transloco }}</button>
                </div>
            </form>
        </div>
    </div>
</section>
