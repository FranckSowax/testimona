<section>
  <div class="donation-failed">
    <div class="container-header">
      <div class="close-modal">
        <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
      </div>
    </div>
    <div class="body">
      <h1>{{ 'donation.failed.title' | transloco }}</h1>
      <p class="subtitle">{{ 'donation.failed.subtitle' | transloco }}</p>
      <div class="buttons">
        <button type="button" class="btn-outlined grey" (click)="closeModal()">{{ 'donation.failed.close' | transloco }}</button>
      </div>
    </div>
  </div>
</section>
