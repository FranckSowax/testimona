<section>
    <div class="admin_memorial">
        <div class="container-header">
            <div class="close-modal">
                <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
            </div>
        </div>
        <h1>{{'memorial.admin_memorial.title' | transloco}}</h1>
        <h2>{{'memorial.admin_memorial.sub_title' | transloco}}</h2>
        <div *ngIf="error_message != ''" class="error-message-api">
            <span>{{ error_message }}</span>
        </div>
        <div>
            <form [formGroup]="adminMemorialForm" (ngSubmit)="onSubmitForm()">
                <label class="container-checkbox">
                    <p>{{ 'memorial.admin_memorial.label' | transloco }}</p>
                    <input type="checkbox" formControlName="isAdmin">
                </label>
                <select matNativeControl formControlName="relatives" id="relatives">
                    <option value="" disabled>{{ 'memorial.admin_memorial.relationship' | transloco }}</option>
                    <option *ngFor="let relative of relatives; let i = index" value="{{i}}">{{relative.value}}</option>
                </select>
                <textarea rows="6" type="text" id="note" formControlName="note" placeholder="{{ 'memorial.admin_memorial.note' | transloco }}"[ngClass]="{
                    'is-invalid':
                    !formControls.note.valid && formControls.note.touched
                }"
                ></textarea>
                <div class="buttons">
                    <button type="submit" class="btn-outlined dark-blue" [disabled]="adminMemorialForm.invalid">{{ 'memorial.admin_memorial.confirm' | transloco }}</button>
                    <button type="button" class="btn-outlined grey" (click)="closeModal()">{{ 'memorial.admin_memorial.cancel' | transloco }}</button>
                </div>
            </form>
        </div>
    </div> 
</section>
