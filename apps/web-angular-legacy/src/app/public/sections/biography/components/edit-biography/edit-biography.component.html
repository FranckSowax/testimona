<section>
  <div *ngIf="!loadingDone" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="loadingDone" class="body">
    <div class="edit-biography">
      <div class="container-header">
        <div class="close-modal">
          <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
        </div>
      </div>
      <div class="body">
        <h1>{{ 'biography.create_biography.create_title' | transloco }}</h1>
        <form [formGroup]="editBiographyForm" (ngSubmit)="onSubmitForm()">
          <input type="text" id="nicknames" formControlName="nicknames"
            placeholder="{{ 'biography.create_biography.nicknames' | transloco }}" />
          <input type="text" id="homeCity" formControlName="homeCity"
            placeholder="{{ 'biography.create_biography.home' | transloco }}" />
          <input type="text" id="placesLived" formControlName="placesLived"
            placeholder="{{ 'biography.create_biography.places' | transloco }}" />
          <input type="text" id="religion" formControlName="religion"
            placeholder="{{ 'biography.create_biography.religion' | transloco }}" />
          <input type="text" id="education" formControlName="education"
            placeholder="{{ 'biography.create_biography.education' | transloco }}" />
          <input type="text" id="work" formControlName="work"
            placeholder="{{ 'biography.create_biography.work' | transloco }}" />
          <input type="text" id="hobbies" formControlName="hobbies"
            placeholder="{{ 'biography.create_biography.hobbies' | transloco }}" />
          <div class="buttons">
            <button type="submit" class="btn-outlined pink">{{
              'biography.create_biography.submit' | transloco }}</button>
            <button type="button" class="btn-outlined grey" (click)="closeModal()">{{
              'biography.create_biography.cancel' | transloco }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
