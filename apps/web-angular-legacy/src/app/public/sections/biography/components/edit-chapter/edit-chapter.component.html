<section>
  <div *ngIf="!loadingDone" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="loadingDone && chapter" class="body">
    <div class="edit-chapter">
      <div class="container-header">
        <div class="close-modal">
          <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
        </div>
      </div>
      <div class="body">
        <h1>{{ 'biography.edit_chapter.title' | transloco }}</h1>
        <form [formGroup]="editChapterForm">
          <input type="text" id="title" formControlName="title"
            placeholder="{{ 'biography.edit_chapter.data_title' | transloco }}" />
          <textarea rows="6" type="text" id="content" formControlName="content"
            placeholder="{{ 'biography.edit_chapter.data_content' | transloco }}"></textarea>
          <shared-upload-media [acceptedFiles]="acceptedFiles" [maximumFiles]="maximumFiles" (onChange)="uploadOnChange($event)"
              [previousFiles]="previousFiles"
              [disabled]="createInProgress">
          </shared-upload-media>
          <div class="buttons">
            <button type="button" (click)="onSubmitForm()" class="btn-outlined pink" [disabled]="editChapterForm.invalid">{{
              'biography.edit_chapter.valid' | transloco }}</button>
            <button type="button" class="btn-outlined grey" (click)="closeModal()">{{
              'biography.edit_chapter.cancel' |
              transloco }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
