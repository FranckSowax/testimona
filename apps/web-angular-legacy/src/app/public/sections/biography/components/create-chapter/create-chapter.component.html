<section>
  <div *ngIf="!loadingDone" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="loadingDone" class="body">
    <div class="create-chapter">
      <div class="container-header">
        <div class="close-modal">
          <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
        </div>
      </div>
      <div class="body">
        <h1>{{ 'biography.create_chapter.create_title' | transloco }}</h1>
        <p class="subtitle">{{ 'biography.create_chapter.create_subtitle' | transloco }}</p>
        <form [formGroup]="createChapterForm">
          <input type="text" id="title" formControlName="title"
            placeholder="{{ 'biography.create_chapter.title' | transloco }}" />
          <textarea rows="6" type="text" id="content" formControlName="content"
            placeholder="{{ 'biography.create_chapter.content' | transloco }}" ></textarea>
          <shared-upload-media [acceptedFiles]="acceptedFiles" [maximumFiles]="maximumFiles" (onChange)="uploadOnChange($event)" [disabled]="createInProgress"></shared-upload-media>
          <div class="buttons">
            <button type="button" *ngIf="!createInProgress" (click)="onSubmitCreateForm()" class="btn-outlined pink">{{
              'biography.create_chapter.submit' | transloco }}</button>
            <button *ngIf="createInProgress" type="button" class="btn-outlined pink" disabled><mat-spinner [diameter]="25"></mat-spinner></button>
            <button type="button" *ngIf="!createInProgress" class="btn-outlined grey" (click)="closeModal()">{{
              'biography.create_chapter.cancel' | transloco }}</button>
            <button *ngIf="createInProgress" type="button" class="btn-outlined grey" disabled>{{ 'biography.create_chapter.cancel' | transloco }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
