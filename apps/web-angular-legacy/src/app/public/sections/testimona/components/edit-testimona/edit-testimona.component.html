<section>
    <div *ngIf="!loadingDone" class="loading">
      <mat-spinner></mat-spinner>
    </div>

    <div *ngIf="loadingDone && testimona" class="body">
      <div class="edit-testimona">
        <div class="container-header">
          <div class="close-modal">
            <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal">
          </div>
        </div>
        <div class="body">
          <h1>{{ 'testimona.edit_testimona.title' | transloco }}</h1>
          <form [formGroup]="editTestimonaForm">
            <textarea rows="6" type="text" id="content" formControlName="content"
              placeholder="{{ 'testimona.edit_testimona.data_content' | transloco }}"></textarea>
            <shared-upload-media [acceptedFiles]="acceptedFiles" [maximumFiles]="maximumFiles" (onChange)="uploadOnChange($event)"
              [previousFiles]="previousFiles" [disabled]="createInProgress">
            </shared-upload-media>
            <div class="buttons">
              <button type="button" (click)="onSubmitForm()" class="btn-outlined pink" [disabled]="editTestimonaForm.invalid">{{
                'testimona.edit_testimona.valid' | transloco }}</button>
              <button type="button" class="btn-outlined grey" (click)="closeModal()">{{
                'testimona.edit_testimona.cancel' |
                transloco }}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
</section>
