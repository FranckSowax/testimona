<section>
    <div *ngIf="!loadingDone">
        <mat-spinner [diameter]="50"></mat-spinner>
    </div>

    <div *ngIf="loadingDone">
        <div *ngIf="listOfTestimona != null" class="list">
            <app-list-item-testimona *ngFor="let testimona of listOfTestimona" [item]="testimona" [relatives]="relatives" (editOnClick)="editOnClick($event)" (deleteOnClick)="deleteOnClick($event)"></app-list-item-testimona>
            <!-- <div *ngIf="loadMoreResult" class="load-more-result">
                <mat-spinner [diameter]="50"></mat-spinner>
            </div> -->
        </div>
    </div>

    <shared-modal-view [modalData]="createTestimonaModalViewModel" >
        <app-create-testimona *ngIf="displayCreateTestimona" [memorialData]="createTestimonaModalModel"></app-create-testimona>
    </shared-modal-view>

    <shared-modal-view [modalData]="editTestimonaModalViewModel">
        <app-edit-testimona *ngIf="displayEditTestimona" [testimonaId]="testimonialId"></app-edit-testimona>
    </shared-modal-view>
</section>
