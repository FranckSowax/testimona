<section>
    <div class="create-testimona">
        <div class="container-header">
            <div class="close-modal">
                <img (click)="closeModal()" src="{{assetUrl}}close-modal.svg" alt="close Modal" [class.no-click]="createInProgress">
            </div>
        </div>
        <h1>{{'testimona.create_testimona.title' | transloco}}</h1>
        <div *ngIf="errorCreateTestimona != ''" class="error-message">
            <span>{{ errorCreateTestimona }}</span>
        </div>
        <form [formGroup]="createTestimonaForm">
            <shared-search-memorial *ngIf="memorialUrl == undefined" [source]="searchParentSourceEnum.CreateTestimona" (resultOnClick)="selectMemorial($event)"></shared-search-memorial>
            <input *ngIf="memorialUrl != undefined" type="text" value="{{ memorialUrl }}" disabled/>
            <textarea rows="6" type="text" id="content" formControlName="content" placeholder="{{ 'testimona.create_testimona.content' | transloco }}" [ngClass]="{
                'is-invalid':
                !formControls.content.valid && formControls.content.touched
            }"
            ></textarea>
            <select matNativeControl formControlName="relatives" id="relatives">
                <option value="undefined" disabled>{{ 'testimona.create_testimona.relationship' | transloco }}</option>
                <option *ngFor="let relative of relatives; let i = index" value="{{i}}">{{relative.value}}</option>
            </select>
            <shared-upload-media [acceptedFiles]="acceptedFiles" [maximumFiles]="maximumFiles" (onChange)="uploadOnChange($event)"
                        [disabled]="createInProgress"></shared-upload-media>
            <div class="buttons">
                <button *ngIf="!createInProgress" type="button" (click)="onSubmitForm()" class="button btn-container pink" [disabled]="createTestimonaForm.invalid">{{ 'testimona.create_testimona.post' | transloco }}</button>
                <button *ngIf="createInProgress" type="button" class="btn-outlined pink" disabled><mat-spinner [diameter]="25"></mat-spinner></button>

                <button type="button" class="btn-outlined grey" (click)="closeModal()" [disabled]="createInProgress">{{ 'testimona.create_testimona.cancel' | transloco }}</button>
            </div>
        </form>
    </div>
</section>
