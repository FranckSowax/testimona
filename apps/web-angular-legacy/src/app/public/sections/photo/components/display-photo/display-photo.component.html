<section>
  <div *ngIf="!loadingDone">
    <mat-spinner></mat-spinner>
  </div>
  <div *ngIf="loadingDone">
    <div class="div-add-photo">
      <a class="add-photo" (click)="addPhoto()">{{ 'photos.display_photo.add_photo' | transloco }}</a>
    </div>
    <div class="listPhotos">
      <div class="div-photos" *ngFor="let photo of listOfPhotos">
        <div class="block-photo">
          <img src="{{ photo.urls.medium }}" alt="" (click)="openFullsize(photo.urls.full)">
          <div class="info-photo">
            <div class="title-photo">
              <p class="title mb0">{{ 'photos.display_photo.posted' | transloco }} {{ photo.userInfos.identity }}</p>
              <p class="data text-align-left">{{ 'photos.display_photo.on' | transloco }} {{ getDate(photo.createdDate) }}</p>
            </div>
            <span *ngIf="myPhoto(photo.userInfos.identity)" class="material-icons" (click)="deletePhoto(photo.photoId)">
              delete
            </span>
            <div>
              <img src="{{ assetUrl }}like-empty.svg" #likeItem alt="like" class="img-like"
                (click)="likePhoto(photo.photoId, likeItem)" *ngIf="!photo.userLiked">
              <img src="{{ assetUrl }}like-filled.svg" #likeItem alt="unlike" class="img-like"
                (click)="likePhoto(photo.photoId, likeItem)" *ngIf="photo.userLiked">
              <p #nbLike class="nb-like">{{photo.numberOfLike}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<shared-modal-view [modalData]="addPhotoModalViewModel">
  <app-add-photo *ngIf="displayAddPhoto" [memorialId]="memorialId">
  </app-add-photo>
</shared-modal-view>
