# Root Railway config (mirrored at apps/web/railway.toml).
# Used when the Railway service has the repo root as its root directory.
# https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
# NODE_ENV=development on install so pnpm includes devDependencies
# (@tailwindcss/postcss, typescript, etc.). Nixpacks sets NODE_ENV=production
# at runtime, which would otherwise skip them and fail `next build`.
buildCommand = "NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @testimona/web build"
# Watch only files that affect the Next.js build.
# apps/web-angular-legacy/** was removed — listing it would skip every
# commit (Railway skipped commits since the legacy dir was deleted).
watchPatterns = [
  "apps/web/**",
  "packages/shared/**",
  "packages/database/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "turbo.json",
  "tsconfig.base.json",
]

[deploy]
startCommand = "pnpm --filter @testimona/web start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 30
